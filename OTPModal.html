<div id="otpModalOverlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:9999;">
    <div style="width:400px; margin:100px auto; background:#ffffff; padding:30px; border-radius:8px; box-shadow:0 0 10px rgba(0,0,0,.30); font-family:Arial, sans-serif;">
      <h2 style="text-align:center; margin-top:0;">Dual OTP Verification</h2>
      <p style="font-size:13px; color:#666; text-align:center;">Enter the verification codes sent to your Email and Mobile.</p>
      
      <input type="hidden" id="otpUserId">
  
      <label style="display:block; margin-top:15px; font-weight:bold;">Email OTP</label>
      <input type="text" id="txtEmailOtp" placeholder="Enter Email OTP (123456)" style="width:100%; padding:10px; margin-top:5px; border:1px solid #ccc; border-radius:4px;" maxlength="6">
  
      <label style="display:block; margin-top:15px; font-weight:bold;">Mobile OTP</label>
      <input type="text" id="txtMobileOtp" placeholder="Enter Mobile OTP (654321)" style="width:100%; padding:10px; margin-top:5px; border:1px solid #ccc; border-radius:4px;" maxlength="6">
  
      <button type="button" onclick="verifyOtpSubmit()" style="width:100%; margin-top:25px; padding:12px; border:none; background:#1565C0; color:white; font-size:16px; cursor:pointer; border-radius:4px;">
        Verify & Proceed
      </button>
  
      <div id="otpMessage" style="margin-top:15px; color:red; text-align:center; font-weight:bold;"></div>
    </div>
  </div>
  
  <script>
  window.showOtpModal = function(data) {
      document.getElementById("otpUserId").value = data.USER_ID;
      document.getElementById("txtEmailOtp").value = "";
      document.getElementById("txtMobileOtp").value = "";
      document.getElementById("otpMessage").innerHTML = "";
      document.getElementById("otpModalOverlay").style.display = "block";
  };
  
  window.verifyOtpSubmit = function() {
      var userId = document.getElementById("otpUserId").value;
      var emailOtp = document.getElementById("txtEmailOtp").value.trim();
      var mobileOtp = document.getElementById("txtMobileOtp").value.trim();
  
      if (!emailOtp || !mobileOtp) {
          document.getElementById("otpMessage").innerHTML = "Please enter both Email and Mobile OTPs.";
          return;
      }
  
      document.getElementById("otpMessage").innerHTML = "<span style='color:blue;'>Verifying OTPs...</span>";
  
      google.script.run
          .withSuccessHandler(function(result) {
              if (!result || !result.success) {
                  document.getElementById("otpMessage").innerHTML = result ? result.message : "OTP Verification failed.";
                  return;
              }
  
              // Save Session and Redirect to Dashboard
              sessionStorage.setItem("SESSION_ID", result.data.SESSION_ID);
              document.getElementById("otpModalOverlay").style.display = "none";
  
              google.script.run
                  .withSuccessHandler(function(html) {
                      var app = document.getElementById("app");
                      if (app) {
                          app.innerHTML = html;
                          var scripts = app.getElementsByTagName("script");
                          for (var i = 0; i < scripts.length; i++) {
                              try { eval(scripts[i].innerText); } catch(e) {}
                          }
                          if (typeof loadDashboard === "function") {
                              loadDashboard();
                          }
                      }
                  })
                  .getPage("Dashboard");
          })
          .withFailureHandler(function(err) {
              document.getElementById("otpMessage").innerHTML = "Error: " + (err.message || err);
          })
          .verifyDummyOTP(emailOtp, mobileOtp, userId);
  };
  </script>
