<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MAP App</title>

  <!-- PWA & Mobile Engine Meta Tags -->
  <meta name="theme-color" content="#1565C0">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MAP App">

  <!-- Correct Relative Manifest Path -->
  <link rel="manifest" href="./manifest.json">

  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #1565C0;
    }

    #appFrame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <iframe 
    id="appFrame" 
    src="https://script.google.com/macros/s/AKfycbzgdEOqz_-MBpQeT2CVQynzUBTtJa-y49aOzM1PntAbEUfqrmb9ZaidMnIQvglLW9n19Q/exec" 
    allow="geolocation; camera; microphone">
  </iframe>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        var swCode = "self.addEventListener('fetch', function(e) {});";
        var blob = new Blob([swCode], { type: 'application/javascript' });
        var swUrl = URL.createObjectURL(blob);
        
        navigator.serviceWorker.register(swUrl).catch(function(err) {
          console.log('SW Note:', err);
        });
      });
    }
  </script>

</body>
</html>
