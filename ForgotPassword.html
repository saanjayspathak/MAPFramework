<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    * { box-sizing: border-box; font-family: Arial, Helvetica, sans-serif; }
    body { margin: 0; padding: 0; background: #f4f4f4; }
    .box {
      width: 92%; max-width: 420px; margin: 50px auto;
      background: #ffffff; padding: 25px; border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,.15);
    }
    h2 { text-align: center; margin-top: 0; color: #1565C0; }
    label { display: block; margin-top: 15px; font-weight: bold; font-size: 13px; }
    input {
      width: 100%; padding: 10px; margin-top: 5px;
      border: 1px solid #cccccc; border-radius: 4px; font-size: 14px;
    }
    button {
      width: 100%; margin-top: 20px; padding: 11px;
      border: none; background: #1565C0; color: white;
      font-size: 15px; cursor: pointer; border-radius: 4px;
    }
    button:hover { background: #0D47A1; }
    .btn-secondary { background: #757575; margin-top: 10px; }
    .btn-secondary:hover { background: #616161; }
    #msg { margin-top: 15px; text-align: center; font-weight: bold; font-size: 13px; min-height: 20px; }
  </style>
</head>
<body>

<div class="box">
  <h2>Reset Password</h2>

  <!-- Step 1: Input Form -->
  <div id="step1">
    <label for="txtResetEmail">Registered Email</label>
    <input type="email" id="txtResetEmail" placeholder="e.g. saanjayspathak@gmail.com">

    <label for="txtResetMobile">Registered Mobile</label>
    <input type="text" id="txtResetMobile" placeholder="e.g. 8830041371">

    <button type="button" onclick="submitForgotPassword()">Verify Account</button>
    <button type="button" class="btn-secondary" onclick="backToLogin()">Back to Login</button>
  </div>

  <!-- Step 2: OTP Entry -->
  <div id="step2" style="display:none;">
    <input type="hidden" id="resetUserId">
    <label for="txtResetEmailOtp">Email OTP</label>
    <input type="text" id="txtResetEmailOtp" placeholder="Enter Email OTP (123456)" maxlength="6">

    <label for="txtResetMobileOtp">Mobile OTP</label>
    <input type="text" id="txtResetMobileOtp" placeholder="Enter Mobile OTP (654321)" maxlength="6">

    <button type="button" onclick="submitResetOtp()">Verify OTPs</button>
  </div>

  <!-- Step 3: Set New Password -->
  <div id="step3" style="display:none;">
    <label for="txtNewPass">New Password</label>
    <input type="password" id="txtNewPass" placeholder="Enter new password">

    <label for="txtConfirmPass">Confirm New Password</label>
    <input type="password" id="txtConfirmPass" placeholder="Re-enter new password">

    <button type="button" onclick="submitNewPassword()">Update Password</button>
  </div>

  <div id="msg"></div>
</div>

<script>
window.submitForgotPassword = function() {
    var email = document.getElementById("txtResetEmail").value.trim();
    var mobile = document.getElementById("txtResetMobile").value.trim();
    var msgDiv = document.getElementById("msg");

    if (!email || !mobile) {
        msgDiv.innerHTML = "<span style='color:red;'>Please enter Email and Mobile.</span>";
        return;
    }

    msgDiv.innerHTML = "<span style='color:blue;'>Verifying account...</span>";

    google.script.run
        .withSuccessHandler(function(res) {
            if (!res || !res.success) {
                msgDiv.innerHTML = "<span style='color:red;'>" + (res ? res.message : "Verification failed") + "</span>";
                return;
            }

            document.getElementById("resetUserId").value = res.data.USER_ID;
            document.getElementById("step1").style.display = "none";
            document.getElementById("step2").style.display = "block";
            msgDiv.innerHTML = "<span style='color:green;'>Account found! Enter OTPs (123456 / 654321).</span>";
        })
        .withFailureHandler(function(err) {
            msgDiv.innerHTML = "<span style='color:red;'>Server Error: " + err + "</span>";
        })
        .processForgotPasswordRequest(email, mobile);
};

window.submitResetOtp = function() {
    var emailOtp = document.getElementById("txtResetEmailOtp").value.trim();
    var mobileOtp = document.getElementById("txtResetMobileOtp").value.trim();
    var userId = document.getElementById("resetUserId").value;
    var msgDiv = document.getElementById("msg");

    if (!emailOtp || !mobileOtp) {
        msgDiv.innerHTML = "<span style='color:red;'>Please enter both OTPs.</span>";
        return;
    }

    // Verify OTPs via server
    google.script.run
        .withSuccessHandler(function(res) {
            if (!res || !res.success) {
                msgDiv.innerHTML = "<span style='color:red;'>" + (res ? res.message : "OTP Verification failed") + "</span>";
                return;
            }

            document.getElementById("step2").style.display = "none";
            document.getElementById("step3").style.display = "block";
            msgDiv.innerHTML = "<span style='color:green;'>OTP Verified! Enter your new password.</span>";
        })
        .withFailureHandler(function(err) {
            msgDiv.innerHTML = "<span style='color:red;'>Error: " + err + "</span>";
        })
        .verifyDummyOTP(emailOtp, mobileOtp, userId);
};

window.submitNewPassword = function() {
    var newPass = document.getElementById("txtNewPass").value.trim();
    var confirmPass = document.getElementById("txtConfirmPass").value.trim();
    var userId = document.getElementById("resetUserId").value;
    var msgDiv = document.getElementById("msg");

    if (!newPass || !confirmPass) {
        msgDiv.innerHTML = "<span style='color:red;'>Please enter and confirm your password.</span>";
        return;
    }

    if (newPass !== confirmPass) {
        msgDiv.innerHTML = "<span style='color:red;'>Passwords do not match.</span>";
        return;
    }

    msgDiv.innerHTML = "<span style='color:blue;'>Updating password...</span>";

    google.script.run
        .withSuccessHandler(function(res) {
            if (!res || !res.success) {
                msgDiv.innerHTML = "<span style='color:red;'>" + (res ? res.message : "Update failed") + "</span>";
                return;
            }

            msgDiv.innerHTML = "<span style='color:green;'>" + res.message + "</span>";
            setTimeout(backToLogin, 2000);
        })
        .withFailureHandler(function(err) {
            msgDiv.innerHTML = "<span style='color:red;'>Error: " + err + "</span>";
        })
        .resetUserPassword(userId, newPass);
};

window.backToLogin = function() {
    google.script.run
        .withSuccessHandler(function(html) {
            var app = document.getElementById("app");
            if (app) {
                app.innerHTML = html;
                var scripts = app.getElementsByTagName("script");
                for (var i = 0; i < scripts.length; i++) {
                    try { eval(scripts[i].innerText); } catch(e) {}
                }
            }
        })
        .getPage("Login");
};
</script>

</body>
</html>
